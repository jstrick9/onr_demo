# Slim DAB for a brand-new workspace (single POC target).
# Set your workspace with: databricks configure
# Then: databricks bundle deploy -t poc

bundle:
  name: onr_demo

targets:
  poc:
    mode: development
    default: true

variables:
  catalog:
    description: Unity Catalog catalog
    default: onr_demo

resources:
  volumes:
    landing_volume:
      name: landing
      catalog_name: ${var.catalog}
      schema_name: bronze
      volume_type: MANAGED
    checkpoints_volume:
      name: checkpoints
      catalog_name: ${var.catalog}
      schema_name: bronze
      volume_type: MANAGED

  sql_warehouses:
    serverless:
      name: onr-demo-warehouse
      cluster_size: 2X-Small
      auto_stop_mins: 10
      warehouse_type: PRO
      enable_serverless_compute: true

  apps:
    onr_demo_app:
      name: onr-demo-poc
      description: "ONR ITSS POC — Elements 3–7"
      source_code_path: ./app-onr-demo
      resources:
        - name: onr-sql-warehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.serverless.id}
            permission: CAN_USE
