# Slim DAB. Does NOT create compute — use the existing workspace objects:
#   SQL warehouse:  onr demo warehouse
#   All-purpose:    onr demo cluster
#
# databricks bundle deploy -t poc

bundle:
  name: onr_demo

targets:
  poc:
    mode: development
    default: true

variables:
  catalog:
    default: onr_demo

resources:
  volumes:
    landing_volume:
      name: landing
      catalog_name: ${var.catalog}
      schema_name: bronze
      volume_type: MANAGED
    checkpoints_volume:
      name: checkpoints
      catalog_name: ${var.catalog}
      schema_name: bronze
      volume_type: MANAGED

  apps:
    onr_demo_app:
      name: onr-demo-poc
      description: "ONR ITSS POC — Elements 3–7"
      source_code_path: ./app-onr-demo
