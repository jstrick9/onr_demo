# ONR ITSS POC — Unity Catalog (single environment, medallion)
# Catalog: onr_demo
# Schemas: bronze | silver | gold | app

schema:
  catalog: "onr_demo"
  layers:
    bronze: "bronze"
    silver: "silver"
    gold: "gold"
    app: "app"

  tables:
    grants: "grants"
    financial: "financial"
    grants_summary: "grants_summary"
    financial_summary: "financial_summary"
    grants_by_awardee: "grants_by_awardee"
    budget_execution: "budget_execution"
    search_history: "search_history"
    export_history: "export_history"
    data_quality_scores: "data_quality_scores"
    lineage_tracking: "lineage_tracking"
    ingestion_quality_log: "ingestion_quality_log"

database:
  bulk_insert_threshold: 5000
  batch_size_small: 5000
  batch_size_medium: 10000
  batch_size_large: 20000
  query_timeout_seconds: 300
  max_retries: 3

ingestion:
  auto_loader_enabled: true
  schema_evolution_mode: "addNewColumns"
  quality_check_enabled: true
  quarantine_enabled: true
  streaming_interval: "30 seconds"
  landing_volume: "/Volumes/onr_demo/bronze/landing"
  checkpoint_volume: "/Volumes/onr_demo/bronze/checkpoints"

governance:
  lineage_tracking_enabled: true
  quality_score_threshold: 0.85
  auto_catalog_enabled: true
  metadata_refresh_hours: 24

analytics:
  model_registry: "onr_demo.gold"
  experiment_path: "/Workspace/Users/${user}/experiments/onr-demo"
  default_model: "random_forest"
  forecast_horizon_days: 90

dashboard:
  max_records_display: 1000
  cache_ttl_seconds: 300
  auto_refresh_enabled: true
  anomaly_alert_threshold: 2.0

export:
  allowed_formats:
    - "csv"
    - "json"
    - "parquet"
  max_export_rows: 1000000
  export_chunksize: 100000

app:
  version: "1.1.0"
  environment: "poc"
  max_file_size_mb: 50
  session_timeout_minutes: 60
  debug_mode: true

mock_data:
  fixture: "resources/mock_data/grants_portfolio.json"
  fixture_contract: "compass.synthetic.v1"
  grants_count: 400
  financial_records_count: 1200
  fiscal_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  program_areas:
    - "AI/ML"
    - "Autonomy"
    - "Biotech"
    - "Cyber"
    - "Directed Energy"
    - "Materials"
    - "Quantum"
    - "Undersea"

etl:
  source_bucket: "s3://onr-demo-landing/"
  load_frequency: "daily"
  data_freshness_hours: 24
  contact_email: "onr-demo@company.com"

logging:
  level: "DEBUG"
  log_queries: true
  log_performance: true
  log_user_actions: true
