# ONR ITSS POC — Development Environment Configuration
# Unity Catalog: onr_demo.dev

schema:
  catalog: "onr_demo"
  schema: "dev"
  
  tables:
    # Bronze layer (raw ingestion)
    bronze_grants: "bronze_grants"
    bronze_financial: "bronze_financial"
    
    # Silver layer (cleansed, validated)
    silver_grants: "silver_grants"
    silver_financial: "silver_financial"
    
    # Gold layer (business-ready aggregates)
    gold_grants_summary: "gold_grants_summary"
    gold_financial_summary: "gold_financial_summary"
    gold_grants_by_awardee: "gold_grants_by_awardee"
    gold_budget_execution: "gold_budget_execution"
    
    # App tables
    search_history: "onr_app_search_history"
    export_history: "onr_app_export_history"
    data_quality_scores: "onr_data_quality_scores"
    lineage_tracking: "onr_lineage_tracking"

# Database Operation Settings
database:
  bulk_insert_threshold: 5000
  batch_size_small: 5000
  batch_size_medium: 10000
  batch_size_large: 20000
  query_timeout_seconds: 300
  max_retries: 3

# Ingestion Settings (Element 3)
ingestion:
  auto_loader_enabled: true
  schema_evolution_mode: "addNewColumns"
  quality_check_enabled: true
  quarantine_enabled: true
  streaming_interval: "30 seconds"
  landing_volume: "/Volumes/onr_demo/dev/landing"

# Governance Settings (Element 4)
governance:
  lineage_tracking_enabled: true
  quality_score_threshold: 0.85
  auto_catalog_enabled: true
  metadata_refresh_hours: 24

# Analytics Settings (Element 5)
analytics:
  model_registry: "onr_demo.dev"
  experiment_path: "/Workspace/Users/${user}/experiments/onr-demo"
  default_model: "random_forest"
  forecast_horizon_days: 90

# Dashboard Settings (Element 6)
dashboard:
  max_records_display: 1000
  cache_ttl_seconds: 300
  auto_refresh_enabled: true
  anomaly_alert_threshold: 2.0  # std deviations

# Export Settings (Element 7)
export:
  allowed_formats:
    - "csv"
    - "json"
    - "parquet"
  max_export_rows: 1000000
  export_chunksize: 100000

# Application Settings
app:
  version: "1.0.0"
  environment: "dev"
  max_file_size_mb: 50
  session_timeout_minutes: 60
  debug_mode: true

# Mock Data Settings
mock_data:
  fixture: "resources/mock_data/grants_portfolio.json"
  fixture_contract: "compass.synthetic.v1"
  grants_count: 400
  financial_records_count: 1200
  fiscal_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  program_areas:
    - "AI/ML"
    - "Autonomy"
    - "Biotech"
    - "Cyber"
    - "Directed Energy"
    - "Materials"
    - "Quantum"
    - "Undersea"

# ETL Integration
etl:
  source_bucket: "s3://onr-demo-landing/dev/"
  load_frequency: "daily"
  data_freshness_hours: 24
  contact_email: "onr-demo@company.com"

# Logging Configuration
logging:
  level: "DEBUG"
  log_queries: true
  log_performance: true
  log_user_actions: true
