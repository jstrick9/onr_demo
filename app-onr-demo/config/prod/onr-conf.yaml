# ONR ITSS POC — Production Environment Configuration
# Unity Catalog: onr_demo.prod

schema:
  catalog: "onr_demo"
  schema: "prod"
  
  tables:
    # Bronze layer (raw ingestion)
    bronze_grants: "bronze_grants"
    bronze_financial: "bronze_financial"
    
    # Silver layer (cleansed, validated)
    silver_grants: "silver_grants"
    silver_financial: "silver_financial"
    
    # Gold layer (business-ready aggregates)
    gold_grants_summary: "gold_grants_summary"
    gold_financial_summary: "gold_financial_summary"
    gold_grants_by_pi: "gold_grants_by_pi"
    gold_budget_execution: "gold_budget_execution"
    
    # App tables
    search_history: "onr_app_search_history"
    export_history: "onr_app_export_history"
    data_quality_scores: "onr_data_quality_scores"
    lineage_tracking: "onr_lineage_tracking"

# Database Operation Settings
database:
  bulk_insert_threshold: 10000
  batch_size_small: 10000
  batch_size_medium: 25000
  batch_size_large: 50000
  query_timeout_seconds: 600
  max_retries: 5

# Ingestion Settings (Element 3)
ingestion:
  auto_loader_enabled: true
  schema_evolution_mode: "addNewColumns"
  quality_check_enabled: true
  quarantine_enabled: true
  streaming_interval: "60 seconds"
  landing_volume: "/Volumes/onr_demo/prod/landing"

# Governance Settings (Element 4)
governance:
  lineage_tracking_enabled: true
  quality_score_threshold: 0.90
  auto_catalog_enabled: true
  metadata_refresh_hours: 12

# Analytics Settings (Element 5)
analytics:
  model_registry: "onr_demo.prod"
  experiment_path: "/Workspace/Users/${user}/experiments/onr-demo-prod"
  default_model: "random_forest"
  forecast_horizon_days: 180

# Dashboard Settings (Element 6)
dashboard:
  max_records_display: 5000
  cache_ttl_seconds: 600
  auto_refresh_enabled: true
  anomaly_alert_threshold: 2.5

# Export Settings (Element 7)
export:
  allowed_formats:
    - "csv"
    - "json"
    - "parquet"
  max_export_rows: 5000000
  export_chunksize: 250000

# Application Settings
app:
  version: "1.0.0"
  environment: "prod"
  max_file_size_mb: 100
  session_timeout_minutes: 30
  debug_mode: false

# Mock Data Settings (prod typically uses real data)
mock_data:
  grants_count: 2000
  financial_records_count: 10000
  fiscal_years: [2020, 2021, 2022, 2023, 2024, 2025, 2026]

# ETL Integration
etl:
  source_bucket: "s3://onr-demo-landing/prod/"
  load_frequency: "daily"
  data_freshness_hours: 12
  contact_email: "onr-demo@company.com"

# Logging Configuration
logging:
  level: "INFO"
  log_queries: false
  log_performance: true
  log_user_actions: true
